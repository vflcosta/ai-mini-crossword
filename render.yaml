# Hosting setup for Render (https://render.com).
# In Render: New > Blueprint > pick this repository. Render reads this file and
# creates both services. The only thing it asks you for is ANTHROPIC_API_KEY.
services:
  # ---- the backend (generates puzzles, talks to Claude) ----
  - type: web
    name: ai-mini-crossword-api
    runtime: python
    plan: free          # sleeps after 15 idle minutes; switch to "starter" to keep it awake
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false     # secret: you type it into Render, it is never stored in git
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: AI_EFFORT
        value: low
      # daily limits (see backend/utils/puzzle_service.py)
      - key: PLAYER_DAILY_LIMIT
        value: "10"     # new themed puzzles one player can make per day
      - key: GLOBAL_DAILY_LIMIT
        value: "500"    # new puzzles all players together can make per day
      - key: PUZZLE_TIMEZONE
        value: Europe/Zurich
      # Render sits behind Cloudflare, which puts the visitor's real address
      # in this header (X-Forwarded-For can be faked by the visitor)
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      # which websites may call the backend: this site's onrender.com address
      - key: ALLOWED_ORIGIN_REGEX
        value: https://ai-mini-crossword(-[a-z0-9]+)?\.onrender\.com
      # When you add your own domain, add an ALLOWED_ORIGINS variable in the
      # Render dashboard with its address, e.g. https://www.mycrossword.com

  # ---- the website (what players open) ----
  - type: web
    name: ai-mini-crossword
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # the website needs the backend's address; Render fills it in
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-mini-crossword-api
          envVarKey: RENDER_EXTERNAL_URL
